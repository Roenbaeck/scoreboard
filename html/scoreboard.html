<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
    <title>Scoreboard</title>
    <link rel="stylesheet" href="controller.css">
    <script>
        // Server will inject token here via template
        window.SCOREBOARD_TOKEN = '{{ token }}';
    </script>
    <script src="scoreboard.js" type="text/javascript"></script>
</head>
<body spellcheck="false">
    <!-- The overlay is built from this markup, so it is uploaded as is and never shown here. -->
    <div class="model" aria-hidden="true">
        <div id="scoreboard" class="scoreboard">
            <div class="home">
                <div id="home_set" class="set">0</div>
                <div id="home_color" class="color">&nbsp;</div>
                <div id="home_team" class="team" contentEditable="true">Home team</div>
                <div id="home_serve" class="serve">&nbsp;</div>
                <div id="home_score" class="score">0</div>
            </div>
            <div class="away">
                <div id="away_set" class="set">0</div>
                <div id="away_color" class="color">&nbsp;</div>
                <div id="away_team" class="team" contentEditable="true">Away team</div>
                <div id="away_serve" class="serve serving">&nbsp;</div>
                <div id="away_score" class="score">0</div>
            </div>
        </div>
    </div>

    <main class="controller">
        <section class="panel" data-side="home" aria-label="Home team">
            <div class="panel_header">
                <label class="swatch" title="Jersey color">
                    <input id="home_color_picker" type="color" data-side="home" aria-label="Home jersey color">
                </label>
                <input id="home_team_input" class="team_input" type="text" data-side="home" aria-label="Home team name"
                       autocomplete="off" autocapitalize="words" enterkeyhint="done">
                <button id="home_serve_button" class="serve_button" type="button" data-side="home" aria-pressed="false" aria-label="Home team serves" title="Serve"></button>
            </div>
            <div class="points">
                <button id="home_score_minus" class="point_minus" type="button" data-counter="home_score" data-action="minus" aria-label="Remove home point">&minus;</button>
                <button id="home_score_plus" class="point_plus" type="button" data-counter="home_score" data-action="plus" aria-label="Add home point">
                    <span id="home_score_value" class="score_value">0</span>
                    <span class="point_hint" aria-hidden="true">+1</span>
                </button>
            </div>
            <div class="sets">
                <span class="sets_label">Sets</span>
                <button id="home_set_minus" class="set_step" type="button" data-counter="home_set" data-action="minus" aria-label="Remove home set">&minus;</button>
                <span id="home_set_value" class="set_value">0</span>
                <button id="home_set_plus" class="set_step" type="button" data-counter="home_set" data-action="plus" aria-label="Add home set">+</button>
            </div>
        </section>

        <section class="panel" data-side="away" aria-label="Away team">
            <div class="panel_header">
                <label class="swatch" title="Jersey color">
                    <input id="away_color_picker" type="color" data-side="away" aria-label="Away jersey color">
                </label>
                <input id="away_team_input" class="team_input" type="text" data-side="away" aria-label="Away team name"
                       autocomplete="off" autocapitalize="words" enterkeyhint="done">
                <button id="away_serve_button" class="serve_button" type="button" data-side="away" aria-pressed="false" aria-label="Away team serves" title="Serve"></button>
            </div>
            <div class="points">
                <button id="away_score_minus" class="point_minus" type="button" data-counter="away_score" data-action="minus" aria-label="Remove away point">&minus;</button>
                <button id="away_score_plus" class="point_plus" type="button" data-counter="away_score" data-action="plus" aria-label="Add away point">
                    <span id="away_score_value" class="score_value">0</span>
                    <span class="point_hint" aria-hidden="true">+1</span>
                </button>
            </div>
            <div class="sets">
                <span class="sets_label">Sets</span>
                <button id="away_set_minus" class="set_step" type="button" data-counter="away_set" data-action="minus" aria-label="Remove away set">&minus;</button>
                <span id="away_set_value" class="set_value">0</span>
                <button id="away_set_plus" class="set_step" type="button" data-counter="away_set" data-action="plus" aria-label="Add away set">+</button>
            </div>
        </section>

        <nav class="toolbar" aria-label="History">
            <button id="undo" class="tool" type="button" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
                Undo
            </button>
            <button id="reset" class="tool tool_reset" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                Reset
            </button>
            <button id="redo" class="tool" type="button" disabled>
                Redo
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
            </button>
        </nav>
    </main>
</body>
</html>
